name: almalinux-compose-test-x86_64

run-name: AlmaLinux ${{ inputs.version_major }} compose test (x86_64)${{ inputs.pungi_repository && ' +pungi' || '' }}${{ inputs.pulp_repository && ' +pulp' || '' }}

on:
  workflow_dispatch:
      inputs:

        version_major:
          description: 'AlmaLinux major version'
          required: true
          default: '10'
          type: choice
          options:
            - 10-kitten
            - 10
            - 9
            - 8

        pungi_repository:
          description: 'Add pungi repositories'
          type: boolean

        pulp_repository:
          description: 'Add pulp repositories'
          type: boolean
          default: true

        testing_repository:
          description: 'Add testing repository'
          type: boolean
          default: false

        disable_default_repos:
          description: 'Disable system default repositories'
          type: boolean
          default: false

        rerun_failed:
          description: 'Re-run failed tests'
          type: boolean
          default: true

        notify_mattermost:
          description: 'Send results notification to Mattermost'
          type: boolean
          default: true

  # Allow this workflow to be called from the 'almalinux-compose-test' orchestrator.
  # 'workflow_call' has no 'choice' input type, so 'version_major' is a string here.
  workflow_call:
    inputs:
      version_major:
        description: 'AlmaLinux major version'
        required: true
        type: string
      pungi_repository:
        description: 'Add pungi repositories'
        type: boolean
        default: false
      pulp_repository:
        description: 'Add pulp repositories'
        type: boolean
        default: true
      testing_repository:
        description: 'Add testing repository'
        type: boolean
        default: false
      disable_default_repos:
        description: 'Disable system default repositories'
        type: boolean
        default: false
      rerun_failed:
        description: 'Re-run failed tests'
        type: boolean
        default: true
      notify_mattermost:
        description: 'Send results notification to Mattermost'
        type: boolean
        default: true

jobs:
  compose-test:
    name: AlmaLinux ${{ matrix.variant }}
    timeout-minutes: 120
    env:
      # Number of guests the tests are split between, run in parallel
      shards: 4
      # Vagrant plugins the jobs need (see the Vagrantfile and the steps below)
      vagrant_plugins: vagrant-reload vagrant-env vagrant-libvirt vagrant-scp
    runs-on: >-
      ${{
        github.repository_owner == 'AlmaLinux' &&
          format('runs-on={0}/family=c8i.8xlarge/image=ubuntu26-full-x64/nested-virt/volume=120gb', github.run_id)
        ||
        'ubuntu-26.04'
      }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(format('["{0}"]', ( inputs.version_major == '10-kitten' && '10-kitten", "10-kitten-x86_64_v2' || ( inputs.version_major == '10' && '10", "10-x86_64_v2' || inputs.version_major ) ) )) }}

    steps:
    - uses: actions/checkout@v7

    - name: Prepare stuff
      run: |
        # Environment variables
        pungi_latest_result=latest_result_almalinux
        pulp_root=${{ inputs.version_major }}
        tmt_options=
        rpm_gpg_key=/etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux
        vm_box=almalinux/${{ inputs.version_major }}
        release_version=${{ inputs.version_major }}
        dnf_crb_repo='CRB'
        dnf_extras_repo='extras'
        basearch=x86_64

        case ${{ matrix.variant }} in
          8)
            dnf_crb_repo='PowerTools'
            ;;
          9)
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-9"
            ;;
          10)
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            ;;
          10-x86_64_v2)
            vm_box=almalinux/10-x86_64_v2
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            basearch=x86_64_v2
            vagrant_cpu_model="Nehalem"
            ;;
          10-kitten)
            vm_box=almalinux/10-kitten
            release_version=10
            pulp_root=kitten-10
            pungi_latest_result="${pungi_latest_result}-kitten"
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            dnf_extras_repo='extras-common'
            ;;
          10-kitten-x86_64_v2)
            vm_box=almalinux/10-kitten-x86_64_v2
            release_version=10
            pulp_root=kitten-10
            pungi_latest_result="${pungi_latest_result}_almalinux-kitten"
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            basearch=x86_64_v2
            dnf_extras_repo='extras-common'
            vagrant_cpu_model="Nehalem"
            ;;
        esac
        # Release major version
        echo "release_version=${release_version}" >> $GITHUB_ENV

        # Basearch for the repositories
        echo "basearch=${basearch}" >> $GITHUB_ENV

        # Pulp repository root of the release
        echo "pulp_root=${pulp_root}" >> $GITHUB_ENV

        # Pungi repository latest results directory
        echo "pungi_latest_result=${pungi_latest_result}" >> $GITHUB_ENV

        # Name of repository to enable (PowerTools/CRB)
        if [ "x${{ inputs.pulp_repository }}" = "xtrue" ]; then
          # Lowercase the name for path in pulp's URL
          pulp_crb_repo="${dnf_crb_repo,,}"
        fi
        echo "dnf_crb_repo=${dnf_crb_repo}" >> $GITHUB_ENV
        echo "pulp_crb_repo=${pulp_crb_repo}" >> $GITHUB_ENV
        echo "dnf_extras_repo=${dnf_extras_repo}" >> $GITHUB_ENV

        # TMT extra options; these go right after 'tmt', before the
        # subcommand -- tmt 1.78 dropped the step-level '--feeling-safe'.
        echo "tmt_options=${tmt_options}" >> $GITHUB_ENV

        # RPM_GPG_KEY file
        echo "rpm_gpg_key=${rpm_gpg_key}" >> $GITHUB_ENV

        # Use proper Vagrantfile and set ENV variable of config.vm.box
        cp -av ci/Vagrant/Vagrantfile ./
        echo vm_box=${vm_box} > .env
        echo shards=${shards} >> .env

        # Vagrant guests, one per shard of the tests
        echo "guests=$(seq -f 'almalinux-%g' -s ' ' 0 $(( shards - 1 )))" >> $GITHUB_ENV
        if [ -n "${vagrant_cpu_model:-}" ]; then
          echo "vagrant_cpu_model=${vagrant_cpu_model}" >> .env
        fi

        # TMT tests run directory
        echo "tmt_run_dir=/var/tmp/tmt/run-001" >> $GITHUB_ENV

        # Local directory on the runner to gather artifacts pulled from the guests
        artifacts_dir="${{ github.workspace }}/artifacts"
        mkdir -p "${artifacts_dir}"
        echo "artifacts_dir=${artifacts_dir}" >> $GITHUB_ENV

        # For nvidia drivers tests
        case ${{ inputs.version_major }} in
          8)
            nvidia=false
            ;;
          *)
            nvidia=true
            ;;
        esac
        echo "nvidia=${nvidia}" >> $GITHUB_ENV

    - name: Configure apt
      run: |
        # Prefer the regional EC2 mirror over archive.ubuntu.com (throttled/unreachable
        # from the runners at times), and make apt fail fast with retries.
        imds_token=$(curl -sf --max-time 5 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' || true)
        region=$(curl -sf --max-time 5 -H "X-aws-ec2-metadata-token: $imds_token" http://169.254.169.254/latest/meta-data/placement/region || true)
        if [ -n "$region" ]; then
          sudo sed -i "s|https\?://archive.ubuntu.com/ubuntu|http://${region}.ec2.archive.ubuntu.com/ubuntu|" /etc/apt/sources.list.d/ubuntu.sources
        fi
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-retries

        # Use Vagrant packages provided by Hashicorp as Ubuntu (24.04+) doesn't build ones
        wget -O - https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list

    - name: Install KVM Packages, Vagrant and Start libvirt
      run: |
        # All in one go: a single index update and dependency resolution.
        # Build dependencies for the ruby-libvirt gem of the vagrant-libvirt plugin
        # (instead of `apt-get build-dep`, which needs deb-src indexes and pulls in
        # the whole debhelper toolchain).
        sudo apt-get -y update
        sudo apt-get -y install qemu-system-x86 libvirt-daemon-system libvirt-clients bridge-utils \
          vagrant nfs-kernel-server ebtables dnsmasq-base \
          build-essential pkg-config ruby-dev libxslt-dev libxml2-dev libvirt-dev zlib1g-dev
        sudo systemctl enable --now libvirtd
        sudo systemctl enable --now nfs-server
        sudo adduser "$(id -un)" libvirt
        sudo adduser "$(id -un)" kvm

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Tune libvirt
      # Group membership added by 'adduser' above isn't active in this runner session
      run: sudo virsh list --all

    - name: Get the Vagrant plugins cache key
      id: vagrant-plugins
      run: |
        # The plugins build native extensions against Vagrant's embedded Ruby
        # and the libvirt and libxml2 of the runner image
        libs=$(dpkg-query -W -f='${Package}=${Version}\n' libvirt-dev libxml2-dev | sha256sum | cut -c1-16)
        echo "key=vagrant-plugins-$(. /etc/os-release; echo ${ID}${VERSION_ID})-$(uname -m)-$(vagrant --version | awk '{print $2}')-${libs}-$(echo ${vagrant_plugins} | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the Vagrant plugins
      id: vagrant-plugins-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/vagrant-plugins
        key: ${{ steps.vagrant-plugins.outputs.key }}

    - name: Install the Vagrant plugins
      run: |
        cache="${{ runner.temp }}/vagrant-plugins"
        if [ -f "${cache}/plugins.json" ]; then
          echo "[Debug] Using the cached Vagrant plugins"
          sudo mkdir -p /root/.vagrant.d
          sudo cp -a "${cache}/gems" "${cache}/plugins.json" /root/.vagrant.d/
          sudo chown -R root:root /root/.vagrant.d
        fi
        installed=$(sudo vagrant plugin list 2>/dev/null || true)
        echo "${installed}"
        missing=
        for plugin in ${vagrant_plugins}; do
          echo "${installed}" | grep -q "^${plugin} " || missing="${missing} ${plugin}"
        done
        if [ -n "${missing}" ]; then
          # In one command: each 'vagrant plugin install' resolves and builds
          # the native extensions of all the plugins again
          sudo vagrant plugin install ${missing}
          rm -rf "${cache}"; mkdir -p "${cache}"
          sudo cp -a /root/.vagrant.d/gems /root/.vagrant.d/plugins.json "${cache}/"
          sudo chown -R "$(id -u):$(id -g)" "${cache}"
        fi

    - name: Save the Vagrant plugins
      if: steps.vagrant-plugins-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/vagrant-plugins
        key: ${{ steps.vagrant-plugins.outputs.key }}

    - name: Create AlmaLinux pungi repository
      if: inputs.pungi_repository
      run: |
        cat <<'EOF'>./almalinux-pungi.repo
        [almalinux-${{ env.release_version }}-appstream-pungi]
        baseurl = http://x86-64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/${{ env.basearch }}/${{ env.pungi_latest_result }}/compose/AppStream/${{ env.basearch }}/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-appstream-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-baseos-pungi]
        baseurl = http://x86-64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/${{ env.basearch }}/${{ env.pungi_latest_result }}/compose/BaseOS/${{ env.basearch }}/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-baseos-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-${{ env.dnf_crb_repo }}-pungi]
        baseurl = http://x86-64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/${{ env.basearch }}/${{ env.pungi_latest_result }}/compose/${{ env.dnf_crb_repo }}/${{ env.basearch }}/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-${{ env.dnf_crb_repo }}-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-${{ env.dnf_extras_repo }}-pungi]
        baseurl = http://x86-64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/${{ env.basearch }}/${{ env.pungi_latest_result }}/compose/${{ env.dnf_extras_repo }}/${{ env.basearch }}/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-${{ env.dnf_extras_repo }}-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux pulp repository
      if: inputs.pulp_repository
      run: |
        cat <<'EOF'>./almalinux-pulp.repo
        [almalinux-${{ env.pulp_root }}-appstream-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-appstream-${{ env.basearch }}/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-appstream-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-baseos-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-baseos-${{ env.basearch }}/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-baseos-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-${{ env.basearch }}/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-${{ env.basearch }}/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux testing pulp repository
      # Kitten has no testing repository, so skip it there
      if: inputs.pulp_repository && inputs.testing_repository && !startsWith(matrix.variant, '10-kitten')
      run: |
        cat <<'EOF'>./almalinux-testing-pulp.repo
        [almalinux-${{ env.pulp_root }}-testing-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-testing-${{ env.basearch }}/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-testing-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux nvidia pulp repository
      if: env.nvidia == 'true' && inputs.pulp_repository
      run: |
        # Repositories of the 'almalinux-nvidia' product
        # https://build.almalinux.org/product/777
        cat <<'EOF'>./almalinux-nvidia-pulp.repo
        [almalinux-${{ env.pulp_root }}-nvidia-pulp]
        baseurl = https://build.almalinux.org/pulp/content/copr/anfimovdm-almalinux-nvidia-almalinux-${{ env.pulp_root }}-${{ env.basearch }}-dr/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-nvidia-pulp
        gpgkey=file://${{ env.rpm_gpg_key }},file:///etc/pki/rpm-gpg/RPM-GPG-KEY-NVIDIA-CUDA-${{ env.release_version }}
        EOF

    - name: Publish tested repository state
      # Digest of the Pulp repositories this job tests, published as the
      # 'compose-state' annotation, so that whoever publishes these
      # repositories can tell which state passed here (ci/compose_state.py).
      # Informational for this job, so it never fails it.
      if: inputs.pulp_repository
      continue-on-error: true
      timeout-minutes: 5
      run: |
        # Repositories the VM gets besides Pulp change what is tested, so
        # they are recorded in the state too.
        sources=pulp
        if [ -f ./almalinux-testing-pulp.repo ]; then sources="${sources}+testing"; fi
        if [ -f ./almalinux-pungi.repo ]; then sources="${sources}+pungi"; fi
        python3 -c 'import yaml' 2>/dev/null || { sudo apt-get -y -q update && sudo apt-get -y -q install python3-yaml; }
        state=$(python3 ci/compose_state.py pulp --version '${{ inputs.version_major }}' \
          --arch '${{ env.basearch }}' --sources "${sources}")
        echo "compose_sources=${sources}" >> "$GITHUB_ENV"
        echo "compose_state=${state}" >> "$GITHUB_ENV"
        echo "::notice title=compose-state::${state}"

    - name: Create results-eval script
      run: |
        # Runs inside the VM (synced as /vagrant): tally pass/fail/total from
        # results.yaml, write the failed-tests list, and a stats file.
        cat <<'EOF'>./ct-eval.sh
        run_dir=${{ env.tmt_run_dir }}
        total=0; passed=0; failed=0; errored=0
        : > ${run_dir}/tests_failed.txt
        for f in $(find ${run_dir}/plans/*/execute -name results.yaml 2>/dev/null); do
          total=$((  total   + $(yq '. | length'                                  "$f" 2>/dev/null || echo 0) ))
          passed=$(( passed  + $(yq '[.[] | select(.result == "pass")]  | length' "$f" 2>/dev/null || echo 0) ))
          failed=$(( failed  + $(yq '[.[] | select(.result == "fail")]  | length' "$f" 2>/dev/null || echo 0) ))
          errored=$((errored + $(yq '[.[] | select(.result == "error")] | length' "$f" 2>/dev/null || echo 0) ))
          yq '.[] | select(.result == "fail" or .result == "error") | .name' "$f" 2>/dev/null \
            >> ${run_dir}/tests_failed.txt
        done
        { echo "total=${total}"; echo "passed=${passed}"; echo "failed=$((failed + errored))"; } \
          > ${run_dir}/tests_stats.txt
        echo "[Debug] failed tests:"; cat ${run_dir}/tests_failed.txt
        echo "[Debug] $(tr '\n' ' ' < ${run_dir}/tests_stats.txt)"
        EOF

    - name: Create test infrastructure script
      run: |
        # Runs inside every guest (synced as /vagrant): install tmt and the
        # test dependencies.
        cat <<'EOF'>./ct-prepare.sh
        enable_repo=${{ env.dnf_crb_repo }}
        dnf_opts="--enablerepo=${enable_repo,,}"
        if [ "${{ inputs.disable_default_repos }}" = "true" ]; then
          # Disable all enabled system repositories
          for enabled_repo in $(dnf repolist --enabled | awk '/repo id/ {A=1; next} A {print $1}' | grep -v -E 'pungi|pulp'); do
            echo "[Debug] Disable '${enabled_repo}' repository"
            dnf config-manager --set-disabled ${enabled_repo}
          done
          dnf_opts=
        fi
        case ${{ matrix.variant }} in
          10-kitten*)
            dnf install -y ${dnf_opts} epel-release almalinux-kitten-release-devel
            [ "${{ inputs.disable_default_repos }}" = "false" ] && \
              dnf_opts="${dnf_opts} --enablerepo=devel"
            dnf install -y ${dnf_opts} python3-pip beakerlib initscripts-service
            export PATH=$PATH:/usr/local/bin; pip install flexparser==0.3.1 tmt
            ;;
          10*)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} python3-pip beakerlib initscripts-service
            export PATH=$PATH:/usr/local/bin; pip install flexparser==0.3.1 tmt
            ;;
          9)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} tmt initscripts-service
            ;;
          *)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} tmt tmt-report-html
            ;;
        esac
        export PATH=$PATH:/usr/local/bin
        echo "[Debug] tmt version: $(tmt --version)"
        EOF

    - name: Run vagrant up
      run: |
        # TODO to solve "undefined method `exists?'" error
        ruby_version=$(sudo /opt/vagrant/embedded/bin/ruby -e 'print "#{ RUBY_VERSION }"')
        sudo find /root/.vagrant.d/gems/${ruby_version}/gems -name dotenv.rb -exec sed -i 's/exists?/exist?/g' {} \;

        # Brings up all the guests in parallel
        sudo vagrant up --no-tty

    - name: Get system release
      run: |
        system_release=$(sudo vagrant ssh almalinux-0 -c "cat /etc/almalinux-release")
        echo "system_release=${system_release}" >> $GITHUB_ENV

    - name: Add testing repository
      # With pulp the testing repo comes from pulp (see the pulp step above).
      # Kitten has no testing repository, so skip it there.
      if: inputs.testing_repository && !inputs.pulp_repository && !startsWith(matrix.variant, '10-kitten')
      run: |
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo dnf install -y almalinux-release-testing"'

    - name: Prepare test infrastructure
      run: ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo bash -e /vagrant/ct-prepare.sh"'

    - name: Get compose-tests
      run: ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo cp -a /vagrant /compose-tests"'

    - name: Split tests between the guests
      run: |
        # Enabled tests for this distro, split by duration (ci/test-durations/)
        # into one tmt 'test --name' regex per guest, pushed to /tmp/ct-shard.regex
        sudo vagrant ssh almalinux-0 -c "sudo sh -c 'export PATH=\$PATH:/usr/local/bin; cd /compose-tests; tmt -c distro=centos-stream-${{ env.release_version }} tests ls --enabled'" \
          | tr -d '\r' | grep '^/' > ./tests_enabled.txt
        python3 ci/shard.py split --shards ${shards} --variant '${{ matrix.variant }}' < ./tests_enabled.txt > ./shards.txt
        for guest in ${guests}; do
          read -r regex <&3
          echo "${regex}" > ./ct-shard.regex
          sudo vagrant scp ./ct-shard.regex ${guest}:/tmp/ct-shard.regex
        done 3< ./shards.txt

    - name: Run tests
      id: run-tests
      continue-on-error: true
      run: |
        # continue-on-error lets us always collect logs and notify; capture the
        # real exit code so a later step can tell a clean run (tmt 0=all pass,
        # 1=some failed) from an aborted one (2 = tmt error, 255 = ssh/VM died).
        set +e
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo sh -c '"'"'export PATH=\$PATH:/usr/local/bin; cd /compose-tests; tmt ${{ env.tmt_options }} -vvv -c distro=centos-stream-${{ env.release_version }} run --all --environment pungi_repository=${{ inputs.pungi_repository }} --environment pulp_repository=${{ inputs.pulp_repository }} provision --how=local test --name \"\$(cat /tmp/ct-shard.regex)\"'"'"'"; echo $? > ./tmt_rc.$guest'
        # The worst exit code of the guests: one outside 0/1 (2 = tmt error,
        # 255 = ssh/VM died) wins over 1 (some failed) over 0 (all pass).
        rc=0
        for guest in ${guests}; do
          guest_rc=$(cat ./tmt_rc.${guest} 2>/dev/null || echo 255)
          echo "[Debug] ${guest} tmt exit code: ${guest_rc}"
          case "${guest_rc}" in
            0) ;;
            1) [ "${rc}" = 0 ] && rc=1 ;;
            *) rc=${guest_rc} ;;
          esac
        done
        echo "[Debug] tmt exit code: ${rc}"
        echo "tmt_rc=${rc}" >> "$GITHUB_OUTPUT"
        exit ${rc}

    - name: Print tests results
      run: |
        for guest in ${guests}; do
          sudo vagrant ssh ${guest} -c "sudo find ${{ env.tmt_run_dir }}/plans/*/execute -name results.yaml -exec cat {} \;"
          for plan in legacy ng; do
            sudo vagrant scp ${guest}:${{ env.tmt_run_dir }}/plans/${plan}/execute/results.yaml "${artifacts_dir}/${guest}.${plan}.results.yaml" || true
          done
        done

    - name: Print tests log
      run: |
        for guest in ${guests}; do
          sudo vagrant ssh ${guest} -c "sudo cat ${{ env.tmt_run_dir }}/log.txt"
          sudo vagrant scp ${guest}:${{ env.tmt_run_dir }}/log.txt "${artifacts_dir}/${guest}.log.txt" || true
        done

    - name: Collect tests output
      run: |
        # Collect whatever output.txt exist (any plan/depth) and tolerate none, so
        # a partial run (e.g. an ng-plan prepare failure that leaves no ng output)
        # doesn't fail here. The run failure itself is reported by the completeness
        # gate ('Fail if the test run did not complete'), not by this step.
        for guest in ${guests}; do
          # single-quoted for the inner sh, so find runs as root in the run dir
          # and not in the vagrant user's login shell
          sudo vagrant ssh ${guest} -c "sudo sh -c 'cd ${{ env.tmt_run_dir }}/ && find . -name output.txt -print0 | tar cf output.tar --null -T -'" || true
          sudo vagrant scp ${guest}:${{ env.tmt_run_dir }}/output.tar "${artifacts_dir}/${guest}.output.tar" || true
        done

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.variant }} tests log
        path: ${{ env.artifacts_dir }}/*.log.txt

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.variant }} tests results
        path: ${{ env.artifacts_dir }}/*.results.yaml

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.variant }} tests output
        path: ${{ env.artifacts_dir }}/*.output.tar

    - name: Evaluate test results
      id: eval
      if: always()
      run: |
        set +e
        # Install 'yq' in the guests, tally results, and build the failed-tests list.
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo dnf -y -q install wget"' || true
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq"' || true
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo chmod +x /usr/bin/yq"' || true
        ci/each-guest.sh 'sudo vagrant ssh $guest -c "sudo sh -c '"'"'chmod +x /vagrant/ct-eval.sh; /vagrant/ct-eval.sh'"'"'"' || true

        # Sum up the guests; the failed-tests list gets '<guest> <test>' lines
        # so that a failed test is re-run on the guest it failed on. A guest
        # with no results at all (every shard runs at least 0_common) means
        # its run was aborted.
        total=0; passed=0; failed=0; empty_guest=false
        : > ./tests_failed.txt
        for guest in ${guests}; do
          sudo vagrant scp ${guest}:${{ env.tmt_run_dir }}/tests_failed.txt ./tests_failed.${guest}.txt || true
          sudo vagrant scp ${guest}:${{ env.tmt_run_dir }}/tests_stats.txt  ./tests_stats.${guest}.txt  || true
          sudo chmod a+r ./tests_failed.${guest}.txt ./tests_stats.${guest}.txt 2>/dev/null || true
          sed "s|^|${guest} |" ./tests_failed.${guest}.txt >> ./tests_failed.txt 2>/dev/null
          guest_total=0
          if [ -f ./tests_stats.${guest}.txt ]; then
            guest_total=$(sed -n 's/^total=//p' ./tests_stats.${guest}.txt)
            passed=$(( passed + $(sed -n 's/^passed=//p' ./tests_stats.${guest}.txt) ))
            failed=$(( failed + $(sed -n 's/^failed=//p' ./tests_stats.${guest}.txt) ))
          fi
          total=$(( total + guest_total ))
          [ "${guest_total}" -eq 0 ] && empty_guest=true
        done
        echo "total=${total}"   >> "$GITHUB_OUTPUT"
        echo "passed=${passed}" >> "$GITHUB_OUTPUT"
        echo "failed=${failed}" >> "$GITHUB_OUTPUT"

        # Completeness: a clean tmt run exits 0 (all pass) or 1 (some failed).
        # Anything else (2 = tmt error, 255 = ssh/VM died) or zero recorded
        # results means the run was aborted before finishing.
        rc='${{ steps.run-tests.outputs.tmt_rc }}'
        incomplete=false
        case "${rc}" in 0|1) ;; *) incomplete=true ;; esac
        [ "${total}" -eq 0 ] && incomplete=true
        [ "${empty_guest}" = true ] && incomplete=true
        echo "incomplete=${incomplete}" >> "$GITHUB_OUTPUT"

        echo "[Debug] total=${total} passed=${passed} failed=${failed} tmt_rc=${rc} incomplete=${incomplete}"

    - name: Re-run failed tests, prepare tests summary
      # Only when the run completed and recorded failures; an aborted run is
      # handled by the completeness gate at the end of the job.
      if: ${{ always() && steps.eval.outputs.incomplete == 'false' && steps.eval.outputs.failed != '0' }}
      run: |
        # Tests results and the step exit code
        rerun_results=
        exit_code=0

        # Read failed tests list: '<guest> <test>' lines
        while read -r guest test_failed; do
          [ -n "${test_failed}" ] || continue
          echo "[Debug] Re-run '${test_failed}' on ${guest}"
          # Exact name as a tmt regex, '+' and '.' made literal (p_gcc-c++)
          test_regex="^$(echo "${test_failed}" | sed 's/[+.]/[&]/g')\$"

          # Include failed test name into resiults summary
          test_result="${test_failed}"

          # Re-run specific failed test, on the guest it failed on
          if [ "${{ inputs.rerun_failed }}" = "true" ]; then
            if sudo vagrant ssh ${guest} -c "sudo sh -c 'export PATH=\$PATH:/usr/local/bin; cd /compose-tests; tmt ${{ env.tmt_options }} -vvv -c distro=centos-stream-${{ env.release_version }} run --all --environment pungi_repository=${{ inputs.pungi_repository }} --environment pulp_repository=${{ inputs.pulp_repository }} provision --how=local test --name \"${test_regex}\"'" < /dev/null; then
              test_result="${test_failed} [re-run ✅]"
            else
              test_result="${test_failed} [re-run ❌]"
              exit_code=1
            fi
          else
            echo "[Debug]"
            echo "If without re-run, fail this step as the '${test_failed}' test previously failed."
            exit_code=1
          fi
          # Format test results in list format: 'item1', 'item2', ...
          [ "x${rerun_results}" = "x" ] && rerun_results="'${test_result}'" || rerun_results="${rerun_results}, '${test_result}'"

        done < ./tests_failed.txt

        # Export header and test results
        [ "x${rerun_results}" = "x" ] && summary_header="✅ All tests pass." || summary_header="❌ Failed tests:"
        echo "rerun_results=${rerun_results}" >> $GITHUB_ENV
        echo "summary_header=${summary_header}" >> $GITHUB_ENV

        exit $exit_code

    - name: Print tests summary
      id: summary
      # Always run so the run-page summary and the Mattermost text are produced
      # for both passing and failing runs.
      if: always()
      uses: actions/github-script@v9
      with:
        result-encoding: string
        script: |
          const repos = [
            'pulp - ${{ inputs.pulp_repository && '➕' || '➖' }}',
            'pungi - ${{ inputs.pungi_repository && '➕' || '➖' }}',
            'testing - ${{ inputs.testing_repository && '➕' || '➖' }}',
            'default repos - ${{ inputs.disable_default_repos && '➖' || '➕' }}',
          ];
          // Re-run annotated failures (set only when the re-run step ran).
          const rerun = [${{ env.rerun_results }}];

          const passed     = parseInt('${{ steps.eval.outputs.passed }}' || '0', 10);
          const failed     = parseInt('${{ steps.eval.outputs.failed }}' || '0', 10);
          const total      = parseInt('${{ steps.eval.outputs.total  }}' || '0', 10);
          const incomplete = '${{ steps.eval.outputs.incomplete }}' === 'true';
          const rc         = '${{ steps.run-tests.outputs.tmt_rc }}';

          // The counts above are the FIRST run. Reconcile them with the re-run
          // outcomes: entries are annotated '… [re-run ✅]' (recovered) /
          // '… [re-run ❌]' (still failing); unmarked means re-run was disabled.
          const reran        = rerun.some(r => r.includes('[re-run'));
          const recovered    = rerun.filter(r => r.includes('✅')).length;
          const stillFailing = rerun.length - recovered;

          let header;
          if (incomplete) header = `⚠️ Test run did NOT complete — only ${total} results recorded (tmt exit ${rc}).`;
          else if (stillFailing > 0) header = `❌ ${stillFailing} of ${total} tests failed.`;
          else if (recovered > 0) header = `✅ All ${total} tests passed (${recovered} recovered on re-run).`;
          else header = `✅ All ${total} tests passed.`;

          const counts = `Passed: ${passed} · Failed: ${failed} · Total: ${total}`;
          const rerunLine = reran ? `Re-run — recovered: ${recovered} · still failing: ${stillFailing}` : '';

          // Run-page summary
          let summary = core.summary
              .addHeading('${{ env.system_release }}', '4')
              .addHeading('Used repositories:', '4')
              .addList(repos, true)
              .addHeading(header, '4')
              .addRaw(counts).addBreak();
          if (rerunLine) summary = summary.addRaw(rerunLine).addBreak();
          summary.addList(rerun, true).write();

          // Failure reason as the 'compose-fail' annotation of this job,
          // readable without auth next to 'compose-state'.
          if (incomplete || stillFailing > 0) {
            core.error(`${header} ${rerun.join(', ')}`.trim().slice(0, 3800), { title: 'compose-fail' });
          }

          // Markdown text for the Mattermost notification
          const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          const text = [
            '#### AlmaLinux ${{ matrix.variant }} (${{ env.basearch }}) — compose tests',
            '**${{ env.system_release }}**',
            '',
            header,
            counts,
            ...(rerunLine ? [rerunLine] : []),
            '',
            '**Used repositories:**',
            ...repos.map(r => '- ' + r),
            ...(rerun.length ? ['', '**Re-run failed tests:**', ...rerun.map(r => '- ' + r)] : []),
            '',
            '[Workflow run](' + runUrl + ')',
          ].join('\n');
          core.setOutput('text', text);

    - name: Check tested repository state drift
      # Pulp may publish while the tests run; then the VM saw a mix of states
      # and this job vouches for none of them. A failed re-digest is reported
      # the same way, since the state could not be confirmed.
      if: always() && env.compose_state != ''
      continue-on-error: true
      timeout-minutes: 5
      run: |
        if ! state=$(python3 ci/compose_state.py pulp --version '${{ inputs.version_major }}' \
            --arch '${{ env.basearch }}' --sources "${compose_sources}"); then
          echo "::warning title=compose-state-drift::unconfirmed, the re-digest after the tests failed"
        elif [ "${state}" != "${compose_state}" ]; then
          echo "::warning title=compose-state-drift::${state}"
        else
          echo "[Debug] Pulp state did not change during the tests"
        fi

    - name: Send notification to Mattermost
      uses: mattermost/action-mattermost-notify@v2.1.0
      # Notify on both pass and fail; never fail the job on a notification error
      if: ${{ always() && inputs.notify_mattermost }}
      continue-on-error: true
      with:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        MATTERMOST_CHANNEL: ${{ vars.MATTERMOST_CHANNEL }}
        MATTERMOST_USERNAME: ${{ github.triggering_actor }}
        TEXT: |
          ${{ steps.summary.outputs.text }}

    - name: Fail if the test run did not complete
      # Runs last (after notification) so an aborted/incomplete run — e.g. a test
      # that wedges the VM, leaving an empty results.yaml — is reported as a
      # failure instead of a false green.
      if: ${{ always() && steps.eval.outputs.incomplete == 'true' }}
      run: |
        echo "::error::Test run did not complete: tmt exit '${{ steps.run-tests.outputs.tmt_rc }}', ${{ steps.eval.outputs.total }} results recorded."
        exit 1
